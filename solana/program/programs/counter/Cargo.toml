[package]
name = "counter"
version = "0.1.0"
description = "Reference Solana counter program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Required so `anchor build` emits target/idl/counter.json (drives the TS client).
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
