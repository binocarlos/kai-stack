[workspace]
members = ["programs/*"]
resolver = "2"

# Pins the Solana CLI toolchain solana-verify uses for verifiable builds
# (matches the CLI bundled in the toolbox image).
[workspace.metadata.cli]
solana = "3.1.10"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
