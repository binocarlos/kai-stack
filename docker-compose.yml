services:
  router:
    image: binocarlos/noxy:v4
    restart: always
    ports:
      - ${ROUTER_PORT:-80}:80
    depends_on:
      - api
      - frontend
    environment:
      - NOXY_DEFAULT_HOST=frontend
      - NOXY_DEFAULT_PORT=80
      - NOXY_DEFAULT_WS=1
      - NOXY_API_FRONT=/api/v1
      - NOXY_API_HOST=api
      - NOXY_API_PORT=80
      - NOXY_API_WS=1

  # No local database: the API connects to Supabase. Provide the POSTGRES_*
  # connection values in .env (see .env.example). This single service runs both
  # the HTTP API and the job queue worker in one process; both are enabled by
  # default (SERVER_ENABLED / WORKER_ENABLED) and can be toggled per-deployment.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-final-build
    restart: always
    env_file:
      - .env
    environment:
      - SERVER_PORT=80
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - SERVER_JWT_SECRET=${SERVER_JWT_SECRET:-secret}
      - SERVER_FIXED_PASSWORD=${SERVER_FIXED_PASSWORD:-secret}
      - WORKER_SECRET=${WORKER_SECRET:-secret}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-final-build
    restart: always
